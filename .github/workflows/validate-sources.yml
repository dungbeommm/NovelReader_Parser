name: Kiểm tra parser JavaScript
on:
  push:
    branches: [main]
    paths: ["sources/**", "scripts/**"]
  pull_request:
    paths: ["sources/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Tạo index
        run: python scripts/generate_index.py
      - name: Kiểm tra cấu trúc
        run: python scripts/validate_sources.py
      - name: Kiểm tra cú pháp JavaScript
        run: find sources -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit sources.json nếu thay đổi
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- sources.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "chore: cập nhật sources.json"
          git push
